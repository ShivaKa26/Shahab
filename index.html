<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>داشبورد مالی شهرک ساحلی شهاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1116;
  --surface:#171c22;
  --surface-raised:#20262e;
  --border:#333b45;
  --text:#f4f6f8;
  --text-muted:#98a2ad;
  --accent:#38bdf8;
  --accent-dim:#1685b5;
  --danger:#ef4444;
  --success:#22c55e;
  --warn:#f59e0b;
  --radius-sm: 6px; --radius-md: 12px; --radius-lg: 20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; overflow-x:hidden;
  font-family:'Vazirmatn',Tahoma,sans-serif;
  background:var(--bg); color:var(--text);
  line-height:1.9; font-size:16px;
  padding:16px; max-width:1100px; margin-inline:auto;
}
button{-webkit-appearance:none; appearance:none;}
header{text-align:center;padding:28px 8px 12px}
header h1{font-size:clamp(22px,4vw,32px);font-weight:700}
header p{color:var(--text-muted);font-size:17px;margin-top:4px}
h2{font-size:20px;font-weight:700;margin-bottom:14px}
section{margin:28px 0}
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:16px 18px;
}
.kpis{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;text-align:center}
.kpi .label{color:var(--text-muted);font-size:15px}
.kpi .value{font-size:clamp(17px,2.4vw,21px);font-weight:700;margin-top:6px;color:var(--accent);word-break:break-word}
.kpi .unit{font-size:14px;color:var(--text-muted)}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px}
#barChart{width:100%;height:auto}
.donut-row{display:grid;gap:16px;align-items:center}
@media(min-width:760px){.donut-row{grid-template-columns:auto 1fr}}
#donut{width:100%;max-width:340px;margin:0 auto;display:block}
.legend{list-style:none;font-size:16px}
.legend li{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border)}
.legend .dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.legend .amt{margin-inline-start:auto;color:var(--text-muted);font-size:14px;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:16px;min-width:520px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--border)}
th{background:var(--surface-raised);cursor:pointer;user-select:none;font-weight:700}
th:hover{color:var(--accent)}
tr:last-child td{border-bottom:none}
tfoot td{font-weight:700;background:var(--surface-raised)}
.acc-head{
  width:100%;display:flex;align-items:center;gap:10px;
  background:var(--surface-raised);border:1px solid var(--border);
  color:var(--text);font:inherit;font-size:17px;font-weight:700;
  padding:14px 16px;border-radius:var(--radius-md);cursor:pointer;text-align:right;
}
.acc-head:hover{border-color:var(--accent-dim)}
.acc-head .total{margin-inline-start:auto;color:var(--accent);font-weight:500;font-size:15px;white-space:nowrap}
.acc-head .arrow{transition:transform .25s;color:var(--text-muted)}
.acc-head[aria-expanded="true"] .arrow{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.acc-inner{border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius-md) var(--radius-md);padding:12px}
.items{list-style:none;font-size:15px}
.items li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:9px 4px;border-bottom:1px dashed var(--border)}
.items li:last-child{border-bottom:none}
.items .desc{flex:1;min-width:200px}
.items .amt{font-weight:700;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);border:1px solid var(--border);border-radius:999px;padding:2px 10px}
.badge .dot{width:9px;height:9px;border-radius:50%}
.warn{
  background:rgba(245,158,11,.12); border:1px solid var(--warn);
  color:var(--warn); border-radius:var(--radius-sm);
  padding:10px 14px; font-size:15px; margin-bottom:10px;
}
footer{text-align:center;color:var(--text-muted);padding:30px 0 18px;border-top:1px solid var(--border);margin-top:40px;font-size:15px}
@media print{
  body{background:#fff;color:#111;padding:0;font-size:13px}
  .card,.kpi,.chart-card{border-color:#ccc;box-shadow:none}
  .acc-head{background:#f2f2f2;color:#111;border-color:#ccc}
  .acc-body{max-height:none !important}
  .arrow{display:none}
  .kpi .value{color:#0b5394}
  .acc-head .total{color:#0b5394}
}
</style>
</head>

  </section>
</main>

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

const esfTotal = MONTHS.find(m => m.month.indexOf("اسفند") > -1).total;
const avgWithout = (grand - esfTotal) / (MONTHS.length - 1);

function renderKPIs(){
  const items = [
    {label:"جمع کل هزینه‌ها (۷ ماه)", value:toman(grand)},
    {label:"میانگین ماهانه", value:toman(avgWith)},
    {label:"مجموع شارژ پرداخت شده", value:toman(522400000)},
    {label:"دریافتی از AV West", value:toman(300000000)}
  ];
  document.getElementById("kpis").innerHTML = items.map(i =>
    '<div class="kpi"><div class="label">'+i.label+'</div><div class="value">'+i.value+'</div></div>'
  ).join("");
}

function abbrev(n){
  const m = n / 1e6;
  return (Math.round(m)).toLocaleString("fa-IR") + "م";
}

function renderBar(){
  const W=760,H=340,padT=20,padB=56,padL=64,padR=14;

  const max=esfTotal*1.08;
  const bw=cw/MONTHS.length;
  let s="";
  for(let i=0;i<=4;i++){
    const y=padT+ch-(ch*i/4);
    s+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#333b45" stroke-width="1"/>';
    s+='<text x="'+(padL-8)+'" y="'+(y+5)+'" font-size="12" fill="#98a2ad" text-anchor="end">'+abbrev(max*i/4)+'</text>';
  }
  MONTHS.forEach((m,i)=>{
    const h=(m.total/max)*ch;
    const x=padL+i*bw+bw*0.18, w=bw*0.64, y=padT+ch-h;
    const isEsf = m.month.indexOf("اسفند")>-1;
    const c = isEsf ? "#ef4444" : "#38bdf8";
    s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6" fill="'+c+'"><title>'+esc(m.month)+' — '+toman(m.total)+'</title></rect>';
    s+='<text x="'+(x+w/2)+'" y="'+(y-8)+'" font-size="12" fill="#f4f6f8" text-anchor="middle">'+abbrev(m.total)+'</text>';
    s+='<text x="'+(x+w/2)+'" y="'+(H-34)+'" font-size="12" fill="#98a2ad" text-anchor="middle">';
    const parts=m.month.split(" ");
    s+='<tspan x="'+(x+w/2)+'" dy="0">'+parts[0]+'</tspan><tspan x="'+(x+w/2)+'" dy="16">'+parts[1]+'</tspan></text>';
  });
  document.getElementById("barChart").innerHTML=s;
}

function renderDonut(){
  const cat={};
  MONTHS.forEach(m=>m.items.forEach(it=>{
    cat[it.category]=(cat[it.category]||0)+it.amount;
  }));
  const entries=Object.entries(cat).sort((a,b)=>b[1]-a[1]);
  const sum=entries.reduce((s,e)=>s+e[1],0);
  const C=2*Math.PI*80;
  let off=0,segs="",leg="";
  entries.forEach(e=>{
    const frac=e[1]/sum, len=frac*C;
    const col=(MONTHS.flatMap(m=>m.items).find(i=>i.category===e[0])||{}).color||"#64748b";
    segs+='<circle r="80" cx="100" cy="100" fill="none" stroke="'+col+'" stroke-width="26" '
      +'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" '
      +'transform="rotate(-90 100 100)"><title>'+esc(e[0])+' — '+toman(e[1])+'</title></circle>';
    leg+='<li><span class="dot" style="background:'+col+'"></span>'+esc(e[0])
      +'<span class="amt">'+fa(e[1])+' ('+fa(frac*100)+'٪)</span></li>';
    off+=len;
  });
  document.getElementById("donut").innerHTML=segs
    +'<text x="100" y="95" text-anchor="middle" font-size="12" fill="#98a2ad">جمع کل</text>'
    +'<text x="100" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#f4f6f8">'+abbrev(sum)+'</text>';
  document.getElementById("legend").innerHTML=leg;
}

let sortKey="month", sortDir=1;
function renderVilla(){
  const rows=MONTHS.map(m=>({month:m.month,total:m.total,villa:m.total/VILLAS}));
  rows.sort((a,b)=>{
    if(sortKey==="month"){
      const ia=MONTHS.findIndex(m=>m.month===a.month), ib=MONTHS.findIndex(m=>m.month===b.month);
      return sortDir*(ia-ib);
    }
    return sortDir*(a[sortKey]-b[sortKey]);
  });
  const tb=document.querySelector("#villaTable tbody");
  tb.innerHTML=rows.map(r=>'<tr><td>'+esc(r.month)+'</td><td>'+toman(r.total)+'</td><td>'+toman(r.villa)+'</td></tr>').join('')
    +'<tfoot><tr><td>جمع</td><td>'+toman(grand)+'</td><td>'+toman(grand/VILLAS)+'</td></tr></tfoot>';
}
document.querySelectorAll("#villaTable th").forEach(th=>{
  th.addEventListener("click",()=>{
    const k=th.dataset.key;
    if(sortKey===k){sortDir*=-1}else{sortKey=k;sortDir=1}
    renderVilla();
  });
});

function renderAccordion(){
  const wrap=document.getElementById("accordion");
  wrap.innerHTML=MONTHS.map((m,i)=>{
    const isEsf=m.month.indexOf("اسفند")>-1;
    const warn=isEsf?'<div class="warn">⚠️ این ماه شامل عیدی، پاداش، سنوات است</div>':"";
    const items=m.items.map(it=>
      '<li><span class="desc">'+esc(it.desc)+'</span>'
      +'<span class="badge"><span class="dot" style="background:'+it.color+'"></span>'+esc(it.category)+'</span>'
      +'<span class="amt">'+toman(it.amount)+'</span></li>'
    ).join("");
    return '<div class="acc-item" style="margin-bottom:10px">'
      +'<button class="acc-head" aria-expanded="false" data-i="'+i+'">'
      +'<span>'+esc(m.month)+'</span>'
      +'<span class="total">'+toman(m.total)+'</span>'
      +'<span class="arrow">▼</span></button>'
      +'<div class="acc-body"><div class="acc-inner">'+warn
      +'<ul class="items">'+items+'</ul></div></div></div>';
  }).join("");
  wrap.querySelectorAll(".acc-head").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const body=btn.nextElementSibling;
      const open=btn.getAttribute("aria-expanded")==="true";
      btn.setAttribute("aria-expanded",String(!open));
      body.style.maxHeight=open?"0":(body.scrollHeight+"px");
    });
  });
}

renderKPIs();
renderBar();
renderDonut();
renderVilla();
renderAccordion();
</script>
